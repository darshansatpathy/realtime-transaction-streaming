[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "realtime-transaction-streaming"
version = "0.1.0"
description = "Exactly-once payment processing on Kafka: transactional consume-process-produce, a sink that stores offsets with the data, independent reconciliation, and fault injection that proves it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Darshan Kumar Satpathy" }]
keywords = ["kafka", "exactly-once", "transactions", "streaming", "payments", "ledger", "reconciliation", "snowflake"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "confluent-kafka>=2.4",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.7",
]

[project.scripts]
txs = "txstream.cli:main"

[project.urls]
Repository = "https://github.com/darshansatpathy/realtime-transaction-streaming"

[tool.hatch.build.targets.wheel]
packages = ["src/txstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["txstream"]
concurrency = ["multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]
"src/txstream/generator.py" = ["S311"]
"src/txstream/chaos.py" = ["S311", "S404", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["txstream"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "snowflake.*"]
ignore_missing_imports = true
